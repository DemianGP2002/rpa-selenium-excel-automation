<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GallinaSegura RPA - Portal de Gestión Agropecuaria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
            border-bottom: 3px solid #10b981;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .checkbox-inline {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-inline input {
            width: 18px;
            height: 18px;
        }

        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #059669;
        }

        .alert-error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #fee2e2;
            border-left: 5px solid #ef4444;
            color: #b91c1c;
            border-radius: 4px;
        }

        .alert-success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #ecfdf5;
            border-left: 5px solid #10b981;
            border-radius: 4px;
            color: #065f46;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #e5e7eb;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f9fafb;
            color: #4b5563;
        }

        #seccion-panel {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- PANTALLA 1: INICIO DE SESIÓN -->
        <div id="seccion-login">
            <h2>GallinaSegura - Acceso al Sistema</h2>
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingrese usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingrese contraseña">
            </div>
            <button type="button" id="btn-login" onclick="iniciarSesion()">Iniciar Sesión</button>
            <div id="login-error" class="alert-error">Credenciales incorrectas. Verifique usuario y contraseña.</div>
        </div>

        <!-- PANTALLA 2: MÓDULO DE INGRESO SANITARIO -->
        <div id="seccion-panel">
            <h2>GallinaSegura - Ingreso de Registros Sanitarios</h2>
            <p style="color: #6b7280; font-size: 14px;">Sesión activa: <strong>Operario de Turno</strong></p>

            <form id="form-ave">
                <div class="form-group">
                    <label for="id_ave">ID del Ave / Lote:</label>
                    <input type="text" id="id_ave" name="id_ave" placeholder="Ej: GAL-1001-A">
                </div>

                <div class="form-group">
                    <label for="zona_actual">Zona Actual:</label>
                    <select id="zona_actual" name="zona_actual">
                        <option value="" disabled selected>Seleccione corral/zona...</option>
                        <option value="Corral Norte">Corral Norte</option>
                        <option value="Corral Sur">Corral Sur</option>
                        <option value="Corral Este">Corral Este</option>
                        <option value="Corral Oeste">Corral Oeste</option>
                        <option value="Perímetro Externo">Perímetro Externo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="peso_kg">Peso Corporal (kg):</label>
                    <input type="text" id="peso_kg" name="peso_kg" placeholder="Ej: 2.1">
                </div>

                <div class="form-group">
                    <label for="estado_salud">Estado Sanitario:</label>
                    <select id="estado_salud" name="estado_salud">
                        <option value="" disabled selected>Seleccione estado...</option>
                        <option value="Sano">Sano</option>
                        <option value="Observación médica">Observación médica</option>
                        <option value="Alerta de Escape">Alerta de Escape</option>
                    </select>
                </div>

                <div class="form-group checkbox-inline">
                    <input type="checkbox" id="alerta_sanitaria" name="alerta_sanitaria">
                    <label for="alerta_sanitaria" style="margin-bottom: 0;">Activar Alerta Sanitaria /
                        Aislamiento</label>
                </div>

                <button type="button" id="btn-guardar" onclick="guardarRegistro()">Guardar Registro</button>
            </form>

            <div id="box-confirmacion" class="alert-success">
                Registro guardado con éxito. ID de comprobante: <strong id="folio-comprobante"></strong>
            </div>

            <table id="tabla-registros">
                <thead>
                    <tr>
                        <th>Comprobante</th>
                        <th>ID Ave</th>
                        <th>Zona</th>
                        <th>Peso</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>
    </div>

    <script>
        function iniciarSesion() {
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();

            if (u === "admin" && p === "granja2026") {
                document.getElementById("seccion-login").style.display = "none";
                document.getElementById("seccion-panel").style.display = "block";
            } else {
                document.getElementById("login-error").style.display = "block";
            }
        }

        let correlativo = 5000;
        function guardarRegistro() {
            const idAve = document.getElementById("id_ave").value.trim();
            const zona = document.getElementById("zona_actual").value;
            const peso = document.getElementById("peso_kg").value.trim();
            const estado = document.getElementById("estado_salud").value;

            if (!idAve) {
                alert("Error: El ID del ave no puede estar vacío.");
                return;
            }

            correlativo++;
            const idComprobante = "COMP-GS-" + correlativo;

            document.getElementById("folio-comprobante").innerText = idComprobante;
            document.getElementById("box-confirmacion").style.display = "block";

            const tbody = document.getElementById("cuerpo-tabla");
            const row = tbody.insertRow(0);
            row.innerHTML = `<td><strong>${idComprobante}</strong></td><td>${idAve}</td><td>${zona}</td><td>${peso} kg</td><td>${estado}</td>`;

            // Limpieza de campos para la siguiente iteración
            document.getElementById("id_ave").value = "";
            document.getElementById("zona_actual").selectedIndex = 0;
            document.getElementById("peso_kg").value = "";
            document.getElementById("estado_salud").selectedIndex = 0;
            document.getElementById("alerta_sanitaria").checked = false;
        }
    </script>

</body>

</html>
